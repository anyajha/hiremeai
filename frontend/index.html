<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="hiremeai-api-base-url" content="" />
<title>HireMeAI</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="clouds">
  <span class="cloud c1"></span>
  <span class="cloud c2"></span>
  <span class="cloud c3"></span>
  <span class="cloud c4"></span>
</div>

<div class="confetti-layer" id="confetti-layer"></div>

<div class="offer-card" id="offer-card">
  <div class="offer-stamp">✔</div>
  <h2>Anya</h2>
  <p class="offer-title">Recommended Hire</p>
  <p class="offer-sub">Approved by HireMeAI</p>
</div>

<div class="app">

  <header class="app-header">
    <div class="bot-avatar" id="bot-avatar">
      <img src="assets/bot-avatar.jpeg" alt="HireMeAI bot" />
    </div>
    <div class="header-text">
      <h1>HireMeAI</h1>
      <p>One of Anya's projects</p>
    </div>
    <div class="mood-orb mood-neutral" id="mood-orb" title="Anya's heartbeat"></div>
    <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
      <span class="toggle-knob"></span>
    </button>
  </header>

  <main id="chat" class="chat"></main>

  <form id="chat-form" class="composer">
    <button type="button" id="mic-btn" class="mic-btn" aria-label="Voice input">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
        <path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z" stroke="currentColor" stroke-width="1.6"/>
        <path d="M19 11a7 7 0 01-14 0M12 19v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
    <input
      id="question"
      type="text"
      placeholder="Type or speak your question..."
      autocomplete="off"
      required
    />
    <button type="submit" id="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
        <path d="M3 11.5L20 4L12.5 21L10.5 13.5L3 11.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </button>
    <button type="button" id="stop-btn" class="stop-btn" aria-label="Stop generation" style="display: none;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
        <rect x="5" y="5" width="4" height="14" rx="1"/>
        <rect x="15" y="5" width="4" height="14" rx="1"/>
      </svg>
    </button>
  </form>

</div>

<script src="script.js"></script>
</body>
</html>
